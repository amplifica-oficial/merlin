version: '3.8'

# Merlin Self-Hosting — simple stack (no MinIO, no ntfy)
#
# Services: postgres + redis + merlin (built from local Dockerfile)
# S3 uploads and ntfy notifications stay off unless you set external URLs.
#
# Usage:
#   1. Copy .env.self-host.example to .env and configure
#   2. Set domain names (API_DOMAIN, DASHBOARD_DOMAIN, etc.)
#   3. Run: docker compose -f docker-compose.test-coolify.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: merlin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: merlin
      POSTGRES_USER: merlin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U merlin" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - merlin

  redis:
    image: redis:7-alpine
    container_name: merlin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - merlin

  merlin:
    build:
      context: .
      dockerfile: Dockerfile
    image: merlin:local
    container_name: merlin
    restart: unless-stopped
    environment:
      SERVICE: all
      NODE_ENV: production

      DATABASE_URL: postgresql://merlin:${DB_PASSWORD:-changeme123}@postgres:5432/merlin
      DIRECT_DATABASE_URL: postgresql://merlin:${DB_PASSWORD:-changeme123}@postgres:5432/merlin

      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET}

      NGINX_PORT: ${NGINX_PORT:-80}

      API_DOMAIN: ${API_DOMAIN:-api.localhost}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-app.localhost}
      WIKI_DOMAIN: ${WIKI_DOMAIN:-docs.localhost}

      USE_HTTPS: ${USE_HTTPS:-false}

      API_URI: ${API_URI:-}
      DASHBOARD_URI: ${DASHBOARD_URI:-}
      WIKI_URI: ${WIKI_URI:-}

      AWS_SES_REGION: ${AWS_SES_REGION}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET}
      SES_CONFIGURATION_SET_NO_TRACKING: ${SES_CONFIGURATION_SET_NO_TRACKING:-}

      MAIL_FROM_SUBDOMAIN: ${MAIL_FROM_SUBDOMAIN:-}

      GITHUB_OAUTH_CLIENT: ${GITHUB_OAUTH_CLIENT:-}
      GITHUB_OAUTH_SECRET: ${GITHUB_OAUTH_SECRET:-}
      GOOGLE_OAUTH_CLIENT: ${GOOGLE_OAUTH_CLIENT:-}
      GOOGLE_OAUTH_SECRET: ${GOOGLE_OAUTH_SECRET:-}

      STRIPE_SK: ${STRIPE_SK:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ONBOARDING: ${STRIPE_PRICE_ONBOARDING:-}
      STRIPE_PRICE_EMAIL_USAGE: ${STRIPE_PRICE_EMAIL_USAGE:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-emails}

      # S3 off by default (empty keys → S3_ENABLED=false). Set for external S3/R2/etc.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_ACCESS_KEY_SECRET: ${S3_ACCESS_KEY_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

      # Notifications off unless you point at external ntfy
      NTFY_URL: ${NTFY_URL:-}

      MERLIN_API_KEY: ${MERLIN_API_KEY:-}
      MERLIN_FROM_ADDRESS: ${MERLIN_FROM_ADDRESS:-}

      AUTO_PROJECT_DISABLE: ${AUTO_PROJECT_DISABLE:-false}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
      EMAIL_RATE_LIMIT_PER_SECOND: ${EMAIL_RATE_LIMIT_PER_SECOND:-}

    volumes:
      - merlin_data:/app/data

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - merlin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  merlin_data:
    driver: local

networks:
  merlin:
    driver: bridge
